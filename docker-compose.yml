services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spatial-agriculture-toolkit
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./output:/app/output
      - ./scripts:/app/scripts
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import streamlit"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
