services:
  # Streamlit web app — interactive UI for spatial interpolation and autocorrelation.
  # Reachable at http://localhost:8501 once the container is healthy.
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spatial-agriculture-toolkit-streamlit
    command:
      - streamlit
      - run
      - app/main.py
      - --server.port=8501
      - --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./output:/app/output
      - ./scripts:/app/scripts
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import streamlit"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # JupyterLab kernel for executing the documentation notebooks under `notebooks/`.
  # Reuses the same image as the streamlit service. Reachable at http://localhost:8888/lab
  # once the container is healthy. Token auth is disabled for local-only use — DO NOT
  # expose port 8888 to the public internet without re-enabling auth.
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spatial-agriculture-toolkit-jupyter
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --allow-root
      - --no-browser
      - --ServerApp.token=
      - --ServerApp.password=
      - --ServerApp.root_dir=/app
    ports:
      - "8888:8888"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./output:/app/output
      - ./scripts:/app/scripts
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
